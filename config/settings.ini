# MSFS Hand Overlay Configuration

[Camera]
LeftCameraIndex = 0
RightCameraIndex = 1
FrameWidth = 640
FrameHeight = 480
FPS = 30
SplitOffsetPixels = 0  # Manual frame-tear split fix, LEFT camera only (0 = off)
UseValveBuiltInCamera = 0  # Capture source: 0 = external USB cameras, 1 = Valve Index built-in
# Separate pixel offsets for each camera (since they're separate physical cameras)
LeftPixelOffsetX = -22  # Left camera X offset
LeftPixelOffsetY = 18  # Left camera Y offset
RightPixelOffsetX = 21  # Right camera X offset
RightPixelOffsetY = 0  # Right camera Y offset
LeftBrightness = 0  # Left camera brightness offset (0 = unchanged)
LeftContrast = 1  # Left camera contrast gain (1.0 = unchanged)
RightBrightness = 46  # Right camera brightness offset (0 = unchanged)
RightContrast = 1  # Right camera contrast gain (1.0 = unchanged)

[ChromaKeyLeft]
HueCenter = 299.5  # Green = 120, Blue = 240
HueRange = 180  # Tolerance around hue
SaturationMin = 0.45  # Min saturation to key
ValueMin = 0  # Min brightness to key
EdgeSoftness = 0.2  # Edge smoothing
InverseMode = 0  # Inverse mode: 1 = hands visible, background transparent

[ChromaKeyRight]
HueCenter = 192.2  # Green = 120, Blue = 240
HueRange = 117.9  # Tolerance around hue
SaturationMin = 0.14  # Min saturation to key
ValueMin = 0  # Min brightness to key
EdgeSoftness = 0.2  # Edge smoothing

[ChromaKeyLeftInverse]
HueCenter = 67.6  # Fair skin hue (~15-25)
HueRange = 24.5  # Skin hue tolerance
SaturationMin = 0.58  # Min saturation for skin
ValueMin = 0.20  # Min brightness for skin
EdgeSoftness = 0.15  # Edge smoothing

[ChromaKeyRightInverse]
HueCenter = 20  # Fair skin hue (~15-25)
HueRange = 25  # Skin hue tolerance
SaturationMin = 0.10  # Min saturation for skin
ValueMin = 0.20  # Min brightness for skin
EdgeSoftness = 0.15  # Edge smoothing

[BorderMask]
MaskSize = 0.217  # Size of gradient mask at edges (0.0-0.5)
Softness = 0.2  # Softness of gradient transition

[Overlay]
Width = 0.879  # Width in meters
Height = 0.652  # Height in meters

# Overlay position in seated space (cockpit-locked)
PosX = -0.004  # X position (left/right) - negative=left, positive=right
PosY = -0.299  # Y position (up/down) - negative=down, positive=up
PosZ = -0.486001  # Z position (forward/back) - negative=back, positive=forward

# Overlay rotation
Pitch = 0.1  # Pitch rotation (tilt up/down)
Yaw = 178.7  # Yaw rotation (turn left/right)
Roll = 9  # Roll rotation (tilt sideways)

# LEGACY: Old head-locked system
Distance = 0.3  # Distance from HMD
HorizontalOffset = -0.04  # Horizontal offset
VerticalOffset = -0.06  # Vertical offset
Opacity = 1  # Overall opacity
XRotation = -93.7  # X-axis rotation (pitch) in degrees
YRotation = -18.7  # Y-axis rotation (yaw/pivot) in degrees
HandBrightness = 1.0  # Hand brightness for night flying (0.0 = dark, 1.0 = normal)

[Input]
JoystickResetButton = 11  # Joystick button for reset overlay position
JoystickID = -1  # Joystick ID (-1 = auto-detect first joystick)

[Segmentation]
KeyingModeAI = 0  # Keying mode: 0 = Chroma Key (legacy), 1 = AI Segmentation
AutoGainEnabled = 0  # Lift dark frames toward AutoGainTarget before AI segmentation (0/1)
AutoGainTarget = 219  # Target mean brightness (0-255) the auto-gain lifts dark frames toward
AutoGainMaxGain = 1  # Cap on the brightness multiplier
ClaheClipLimit = 7  # Local contrast enhancement strength on the AI segmentation model's input
